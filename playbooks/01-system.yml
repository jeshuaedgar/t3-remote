# Ubuntu 24.04 packages and automatic security updates.
---
- name: 01 - Ubuntu packages and security updates
  hosts: t3_remote
  become: true
  tasks:
    - name: Require Ubuntu 24.04
      ansible.builtin.assert:
        that: ansible_facts['distribution_version'] == '24.04'
    - name: Install base packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, git, build-essential, pkg-config, autoconf, bison, libssl-dev,
               libyaml-dev, libreadline-dev, zlib1g-dev, libffi-dev, libgmp-dev, libicu74, python3,
               python3-venv, python3-debian, unzip, zip, jq, ripgrep, tmux, sudo, openssh-server,
               unattended-upgrades]
        update_cache: true
        cache_valid_time: 3600
    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: '0644'
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
