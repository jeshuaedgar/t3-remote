# Run separately, only AFTER joining Tailscale and pointing inventory.ini at the tailnet name.
# Binds sshd and Ubuntu's ssh.socket to Tailscale addresses only; password login is disabled.
---
- name: 09 - Restrict SSH to Tailscale
  hosts: t3_remote
  become: true
  tasks:
    - name: Read this server's Tailscale addresses
      ansible.builtin.command: tailscale ip
      register: tailnet_ips
      changed_when: false
      check_mode: false
    - name: Require a running Tailscale
      ansible.builtin.assert:
        that: tailnet_ips.stdout_lines | length > 0
    - name: Configure sshd
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-t3-tailnet.conf
        mode: '0644'
        validate: /usr/sbin/sshd -t -f %s
        content: |
          {% for ip in tailnet_ips.stdout_lines %}
          ListenAddress {{ ip }}
          {% endfor %}
          PasswordAuthentication no
          KbdInteractiveAuthentication no
      register: sshd_conf
    - name: Create the socket override directory
      ansible.builtin.file:
        path: /etc/systemd/system/ssh.socket.d
        state: directory
        mode: '0755'
    - name: Replace Ubuntu's wildcard SSH socket listeners
      ansible.builtin.copy:
        dest: /etc/systemd/system/ssh.socket.d/10-t3-tailnet.conf
        mode: '0644'
        content: |
          [Unit]
          After=tailscaled.service
          [Socket]
          ListenStream=
          {% for ip in tailnet_ips.stdout_lines %}
          ListenStream={{ '[' + ip + ']' if ':' in ip else ip }}:22
          {% endfor %}
          FreeBind=yes
      register: ssh_socket
    - name: Apply the new SSH listeners
      when: sshd_conf.changed or ssh_socket.changed
      block:
        - name: Reload systemd
          ansible.builtin.systemd_service:
            daemon_reload: true
        - name: Restart SSH without waiting on this connection
          ansible.builtin.command: systemctl restart ssh.socket ssh.service
          async: 45
          poll: 0
        - name: Reconnect over Tailscale
          ansible.builtin.meta: reset_connection
        - name: Prove the new connection works
          ansible.builtin.wait_for_connection:
            timeout: 60
