[t3_remote]
# Use your existing SSH key/agent. Replace the example IP or use an SSH alias.
devbox ansible_host=YOUR_SERVER_IP ansible_user=root

# After joining Tailscale, use its IP and the dev user before running stage 09:
# devbox ansible_host=YOUR_MACHINE_NAME ansible_user=dev   # MagicDNS short name
# If that address is new to known_hosts, verify the same server's host key first.

[t3_remote:vars]
ansible_python_interpreter=/usr/bin/python3
